name: Deploy to GitHub Pages

on:
  push:
    branches: [ base ] # 你要部署的分支
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 先把 repo 拿下來
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 安裝 Node.js 22.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # 3️⃣ 確保 pnpm 可用
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      # 4️⃣ 確保 content 資料夾存在
      - name: Ensure content folder
        run: |
          mkdir -p content

      # 5️⃣ 安裝依賴並 build
      - name: Install dependencies & build
        run: |
          pnpm install
          pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4